<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monaco Editor with Groovy Language Support</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <!-- 1. 引入 Monaco Editor 加载器 -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/loader.js"></script>
    <script>
      // 2. 配置 Monaco Editor 的资源路径
      require.config({
        paths: {
          vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs",
        },
      });

      require(["vs/editor/editor.main"], function () {
        // 3. 定义 Groovy 语言的 Monarch 语法规则
        const groovyLanguageDef = {
          defaultToken: "invalid",
          tokenPostfix: ".groovy",

          keywords: [
            "as",
            "assert",
            "break",
            "case",
            "catch",
            "class",
            "const",
            "continue",
            "def",
            "default",
            "do",
            "else",
            "enum",
            "extends",
            "finally",
            "for",
            "goto",
            "if",
            "implements",
            "import",
            "in",
            "instanceof",
            "interface",
            "new",
            "package",
            "return",
            "super",
            "switch",
            "this",
            "throw",
            "throws",
            "trait",
            "try",
            "while",
            "true",
            "false",
            "null",
            "void",
          ],

          typeKeywords: [
            "boolean",
            "byte",
            "char",
            "double",
            "float",
            "int",
            "long",
            "short",
          ],

          operators: [
            "=",
            ">",
            "<",
            "!",
            "~",
            "?",
            ":",
            "==",
            "<=",
            ">=",
            "!=",
            "&&",
            "||",
            "++",
            "--",
            "+",
            "-",
            "*",
            "/",
            "&",
            "|",
            "^",
            "%",
            "<<",
            ">>",
            ">>>",
            "+=",
            "-=",
            "*=",
            "/=",
            "&=",
            "|=",
            "^=",
            "%=",
            "<<=",
            ">>=",
            ">>>=",
            "<=>",
            "**",
            "?.",
            "*.",
            "..",
            "...",
          ],

          symbols: /[=><!~?:&|+\-*\/\^%]+/,

          escapes:
            /\\(?:[abfnrtv\\"']|x[0-9A-Fa-f]{1,4}|u[0-9A-Fa-f]{4}|U[0-9A-Fa-f]{8})/,

          tokenizer: {
            root: [
              [
                /[a-zA-Z_$][\w$]*/,
                {
                  cases: {
                    "@typeKeywords": "keyword.type",
                    "@keywords": "keyword",
                    "@default": "identifier",
                  },
                },
              ],
              { include: "@whitespace" },
              [/[{}()\[\]]/, "@brackets"],
              [/[<>](?!@symbols)/, "@brackets"],
              [
                /@symbols/,
                {
                  cases: {
                    "@operators": "operator",
                    "@default": "",
                  },
                },
              ],
              [/@\s*[a-zA-Z_\$][\w\$]*/, "annotation"],
              [/\d*\.\d+([eE][\-+]?\d+)?/, "number.float"],
              [/0[xX][0-9a-fA-F]+/, "number.hex"],
              [/\d+/, "number"],
              [/[;,.]/, "delimiter"],
              // 字符串处理
              [/"([^"\\]|\\.)*$/, "string.invalid"],
              [/'([^'\\]|\\.)*$/, "string.invalid"],
              // 支持 GString 和多行字符串
              [/"""/, { token: "string", next: "@gstring_double" }],
              [/"/, { token: "string", next: "@string_double" }],
              [/'''/, { token: "string", next: "@string_single" }],
              [/'/, { token: "string", next: "@string_single" }],
            ],

            whitespace: [
              [/[ \t\r\n]+/, ""],
              [/\/\*/, "comment", "@comment"],
              [/\/\/.*$/, "comment"],
            ],

            comment: [
              [/[^\/*]+/, "comment"],
              [/\*\//, "comment", "@pop"],
              [/[\/*]/, "comment"],
            ],

            string_double: [
              [/[^\\"$]+/, "string"],
              [/@escapes/, "string.escape"],
              [/\$/, "string.escape", "@gstring_variable"], // GString 插值
              [/\\./, "string.escape.invalid"],
              [/"/, "string", "@pop"],
            ],

            gstring_double: [
              [/[^\\"$]+/, "string"],
              [/@escapes/, "string.escape"],
              [/\$/, "string.escape", "@gstring_variable"], // GString 插值
              [/\\./, "string.escape.invalid"],
              [/"""/, "string", "@pop"],
            ],

            string_single: [
              [/[^\\']+/, "string"],
              [/@escapes/, "string.escape"],
              [/\\./, "string.escape.invalid"],
              [/'/, "string", "@pop"],
            ],

            gstring_variable: [
              [/\$([a-zA-Z_]\w*)/, "identifier"],
              [/\{/, "delimiter", "@gstring_expression"],
              ["", "", "@pop"], // 默认返回
            ],
            gstring_expression: [
              [/}/, "delimiter", "@pop"],
              { include: "root" }, // 在 ${...} 内部可以包含任何 groovy 代码
            ],
          },
        };

        // 4. 注册 Groovy 语言
        monaco.languages.register({ id: "groovy" });

        // 5. 为 Groovy 设置语法规则
        monaco.languages.setMonarchTokensProvider("groovy", groovyLanguageDef);

        // (可选) 设置语言配置，如注释和括号
        monaco.languages.setLanguageConfiguration("groovy", {
          comments: {
            lineComment: "//",
            blockComment: ["/*", "*/"],
          },
          brackets: [
            ["{", "}"],
            ["[", "]"],
            ["(", ")"],
          ],
          autoClosingPairs: [
            { open: "{", close: "}" },
            { open: "[", close: "]" },
            { open: "(", close: ")" },
            { open: "'", close: "'", notIn: ["string", "comment"] },
            { open: '"', close: '"', notIn: ["string", "comment"] },
          ],
          surroundingPairs: [
            { open: "{", close: "}" },
            { open: "[", close: "]" },
            { open: "(", close: ")" },
            { open: "'", close: "'" },
            { open: '"', close: '"' },
          ],
        });

        // 6. 创建编辑器实例
        const editor = monaco.editor.create(
          document.getElementById("container"),
          {
            value: `
package com.example

/**
 * 一个简单的 Groovy 类示例
 */
@Grab('com.google.code.gson:gson:2.8.6')
import com.google.gson.Gson

class Person {
    String name
    int age = 30
    static final GREETING = "Hello"

    def greet(String title) {
        // Groovy 的 GString 插值
        def message = """
            $GREETING, my name is $title $name.
            I am \${age} years old.
            Next year I will be \${age + 1}.
        """
        println message
        
        // 正则表达式
        def pattern = ~/\\d+/
        assert "123" ==~ pattern
    }
}

def p = new Person(name: 'Alice')
p.greet('Dr.')

def list = [1, 2, 3, 4, 5]
def squared = list.collect { it * it }
println "Squared list: $squared"
                `,
            language: "groovy",
            theme: "vs-dark",
            automaticLayout: true,
          }
        );
      });
    </script>
  </body>
</html>
